<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <strong>My Website</strong>
    </nav>

    <main>

        <section class="card-container">

            <article class="card">
                <span class="badge">New</span>

                <h2>Card One</h2>

                <p>
                    This card demonstrates relative and absolute positioning.
                </p>
            </article>

            <article class="card">
                <span class="badge">New</span>

                <h2>Card Two</h2>

                <p>
                    The notification badge is positioned inside the card.
                </p>
            </article>

            <article class="card">
                <span class="badge">New</span>

                <h2>Card Three</h2>

                <p>
                    CSS positioning controls where elements appear.
                </p>
            </article>

        </section>

    </main>

    <button class="back-to-top">↑</button>

</body>
</html>
