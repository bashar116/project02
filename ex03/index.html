<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Color Swatch Palette</h1>

    <div class="named">
        Named Color
    </div>

    <div class="hex">
        HEX Color
    </div>

    <div class="rgb">
        RGB Color
    </div>

    <div class="rgba">
        RGBA Color
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <strong>Opacity: 0.5</strong>
    </div>

    <div class="rgba-box">
        <strong>RGBA Background: 0.5</strong>
    </div>

</body>
</html>
